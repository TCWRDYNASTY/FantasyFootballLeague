name: Tanking Meter Sleeper Collector

on:
  workflow_dispatch:
  schedule:
    # Runs every 15 minutes. GitHub scheduled runs are best-effort,
    # not guaranteed to start at the exact minute.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: tanking-meter-sleeper-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Collect Sleeper snapshot and save to Firestore
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: tcwr-dynasty
          SLEEPER_LEAGUE_ID: "1328431789223477248"
        run: npm run collect
