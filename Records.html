const sheetUrl =
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjIjcUVkLUwsSErcmBR-WHYSu6WxbAlckp2oZOGkDQFoqea7El8QLa2shDlyrUPSAXZtv89DzcMcvk/pub?gid=242455735&single=true&output=csv';

async function fetchAndDisplayRankings() {

    console.log("Status: Fetching CSV data directly...");

    try {

        const response = await fetch(sheetUrl);

        if (!response.ok) {
            throw new Error(`Network error: ${response.status}`);
        }

        const csvText = await response.text();

        const rows = csvText
            .split(/\r?\n/)
            .filter(row => row.trim() !== "")
            .map(row => {

                const matches =
                    row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);

                return matches
                    ? matches.map(cell =>
                        cell.replace(/^"(.*)"$/, '$1').trim()
                    )
                    : [];

            });

        const container =
            document.getElementById('leaderboard');

        container.innerHTML = "";

        for (let i = 3; i < rows.length; i++) {

            const col = rows[i];

            if (!col[0] || isNaN(col[0])) {
                continue;
            }

            const rank = col[0];
            const manager = col[1];
            const totalScore = col[2];

            const winPctPts = col[6];
            const tpfPts = col[8];
            const tpaPts = col[10];
            const playoffPts = col[12];
            const champAppPts = col[14];
            const ringsPts = col[16];

            container.innerHTML += `

                <div
                  class="ranking-card"
                  data-rank="${String(rank).replace(/"/g,'&quot;')}" data-manager="${String(manager).replace(/"/g,'&quot;')}" role="button" tabindex="0"
                >

                    <div class="rank-number">
                      ${rank}
                    </div>

                    <div class="manager-info">

                        <span class="real-name">
                          ${manager}
                        </span>
                        <span class="dossier-link">CLICK TO VIEW DOSSIER</span>

                    </div>

                    <div class="total-score">
                      ${totalScore}
                      <span>/ 10</span>
                    </div>

                    <div class="stats-sub-grid">

                        <div class="stat-item">
                          <span class="stat-label">Win %</span>
                          <span class="stat-value">${winPctPts}</span>
                        </div>

                        <div class="stat-item">
                          <span class="stat-label">TPF</span>
                          <span class="stat-value">${tpfPts}</span>
                        </div>

                        <div class="stat-item">
                          <span class="stat-label">TPA</span>
                          <span class="stat-value">${tpaPts}</span>
                        </div>

                        <div class="stat-item">
                          <span class="stat-label">Playoffs</span>
                          <span class="stat-value">${playoffPts}</span>
                        </div>

                        <div class="stat-item">
                          <span class="stat-label">Champ App</span>
                          <span class="stat-value">${champAppPts}</span>
                        </div>

                        <div class="stat-item">
                          <span class="stat-label">Rings</span>
                          <span class="stat-value">${ringsPts}</span>
                        </div>

                    </div>

                    <div class="win-bar-container">

                        <div
                          class="win-bar-fill"
                          style="width: ${parseFloat(totalScore) * 10}%">
                        </div>

                    </div>

                </div>

            `;

        }

        container.innerHTML += `

            <div class="ranking-card info-card">

                <div class="info-header">
                  Point Assignment
                </div>

                <div class="info-desc">
                  Rankings are weighted based on total performance.
                </div>

                <div class="stats-sub-grid">

                    <div class="stat-item">
                      <span class="stat-label">Win %</span>
                      <span class="stat-value">2.0</span>
                    </div>

                    <div class="stat-item">
                      <span class="stat-label">TPF</span>
                      <span class="stat-value">2.0</span>
                    </div>

                    <div class="stat-item">
                      <span class="stat-label">TPA</span>
                      <span class="stat-value">1.5</span>
                    </div>

                    <div class="stat-item">
                      <span class="stat-label">Playoffs</span>
                      <span class="stat-value">1.5</span>
                    </div>

                    <div class="stat-item">
                      <span class="stat-label">Champ App</span>
                      <span class="stat-value">1.0</span>
                    </div>

                    <div class="stat-item">
                      <span class="stat-label">Rings</span>
                      <span class="stat-value">2.0</span>
                    </div>

                </div>

            </div>

        `;

    } catch (error) {

        console.error("Critical Error:", error);

        document.getElementById('leaderboard').innerHTML =

            `<p style="text-align:center; color:#fc8181;">
              <strong>Data Load Failed</strong>
              <br>
              ${error.message}
            </p>`;

    }

}

function resolveDossierKey(login){const clean=String(login||'').trim().replace(/^@/,'');return dossierKeyByLogin[clean]||clean;}
async function fetchManagerStats(managerId){try{const r=await fetch(managerStatsCsvUrl,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const text=await r.text();const rows=text.split(/\r?\n/).filter(Boolean).map(parseCsvLine);if(rows.length<2)return null;const headers=rows[0].map(x=>String(x).trim().toLowerCase());const norm=v=>String(v??'').toLowerCase().replace(/^@/,'').replace(/[^a-z0-9]/g,'');const target=norm(managerId);const row=rows.slice(1).find(r=>r.some(c=>{const n=norm(c);return n===target||n.includes(target)||target.includes(n);}));if(!row)return null;const out={};headers.forEach((h,i)=>out[h]=row[i]??'');return out;}catch(e){console.warn('Manager statistics spreadsheet unavailable; using Firebase dossier data.',e);return null;}}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;}
function val(d,names,fallback){if(!d)return fallback;for(const n of names){const k=Object.keys(d).find(x=>x===n||x.replace(/[^a-z0-9]/g,'')===n.replace(/[^a-z0-9]/g,''));if(k&&d[k]!=='')return d[k];}return fallback;}
function generateH2HRows(id){return(managerDataStore[id]||[]).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td style="font-weight:bold;color:${String(r[4]).startsWith('+')?'#4ade80':'#f87171'}">${r[4]}</td></tr>`).join('');}
async function openDossier(login,name,rank){const overlay=document.getElementById('full-page-overlay'),target=document.getElementById('dossier-target'),dossierKey=resolveDossierKey(login);overlay.classList.remove('overlay-hidden');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';target.innerHTML=`<div style="text-align:center;padding:60px;color:#ffd56b;font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;letter-spacing:.12em">LOADING DOSSIER...</div>`;let fb=null;try{if(db){const doc=await db.collection('managers').doc(dossierKey).get();if(doc.exists)fb=doc.data();}}catch(e){console.warn('Firebase dossier lookup unavailable:',e);}const stats=fb?null:await fetchManagerStats(login);const d=fb||stats||{};const displayName=val(d,['memberid','manager','name'],name);target.innerHTML=`<div><h1 style="text-align:center;color:#FFD700;font-size:2.5rem;margin:0 0 20px">${displayName}</h1></div><div class="dossier-grid"><div class="dossier-section"><h3>Manager Stats</h3><div class="dossier-stat-list"><p><strong>Seasons:</strong> ${val(d,['seasons'],'0')}</p><p><strong>Rank:</strong> #${val(d,['rank'],rank||'N/A')}</p><p><strong>Record:</strong> ${val(d,['careerrecord','record'],'0-0')} (${val(d,['winpct','winpercentage'],'0%')})</p><p><strong>Avg PPG:</strong> ${val(d,['careeravg','averageppg','avgppg'],'0.00')}</p><p><strong>Playoffs:</strong> ${val(d,['playoffappearances','playoffs'],'0')}</p><p><strong>Rings:</strong> ${val(d,['championships','rings'],'0')} 🏆</p></div></div><div class="dossier-section"><h3>Head-to-Head History</h3><div class="h2h-scroll"><table class="dossier-table"><thead><tr><th>Opponent</th><th>Rec</th><th>Total PF</th><th>Avg</th><th>Diff</th></tr></thead><tbody>${generateH2HRows(dossierKey)}</tbody></table></div></div></div>`;}
function closeDossier(){const o=document.getElementById('full-page-overlay');o.classList.add('overlay-hidden');o.setAttribute('aria-hidden','true');document.body.style.overflow='';}
