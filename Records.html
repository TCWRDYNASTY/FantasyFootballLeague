    function parseCsvLine(line){
      const cells=[];let current='';let quoted=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"' && line[i+1]==='"' && quoted){current+='"';i++;continue}
        if(ch==='"'){quoted=!quoted;continue}
        if(ch===',' && !quoted){cells.push(current.trim());current='';continue}
        current+=ch;
      }
      cells.push(current.trim());
      return cells;
    }

    async function fetchAndDisplayRankings(){
      try{
        const response=await fetch(sheetUrl);
        if(!response.ok)throw new Error(`Network error: ${response.status}`);
        const csvText=await response.text();
        const rows=csvText.split(/\r?\n/).filter(r=>r.trim()!=="").map(parseCsvLine);
        const container=document.getElementById('leaderboard');
        container.innerHTML='';

        for(let i=3;i<rows.length;i++){
          const col=rows[i];
          if(!col[0]||isNaN(col[0]))continue;
          const rank=col[0],manager=col[1],totalScore=col[2];
          const winPctPts=col[6],tpfPts=col[8],tpaPts=col[10],playoffPts=col[12],champAppPts=col[14],ringsPts=col[16];
          const managerId=dossierIdMap[manager]||manager;
          const card=document.createElement('div');
          card.className='ranking-card';card.dataset.rank=rank;card.dataset.managerId=managerId;card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('aria-label',`Open ${manager} manager dossier`);
          card.innerHTML=`
            <div class="rank-number">${rank}</div>
            <div class="manager-info"><span class="real-name">${manager}</span></div>
            <div class="total-score">${totalScore}<span>/ 10</span></div>
            <div class="stats-sub-grid">
              <div class="stat-item"><span class="stat-label">Win %</span><span class="stat-value">${winPctPts}</span></div>
              <div class="stat-item"><span class="stat-label">TPF</span><span class="stat-value">${tpfPts}</span></div>
              <div class="stat-item"><span class="stat-label">TPA</span><span class="stat-value">${tpaPts}</span></div>
              <div class="stat-item"><span class="stat-label">Playoffs</span><span class="stat-value">${playoffPts}</span></div>
              <div class="stat-item"><span class="stat-label">Champ App</span><span class="stat-value">${champAppPts}</span></div>
              <div class="stat-item"><span class="stat-label">Rings</span><span class="stat-value">${ringsPts}</span></div>
            </div>
            <div class="win-bar-container"><div class="win-bar-fill" style="width:${Math.max(0,Math.min(100,parseFloat(totalScore)*10||0))}%"></div></div>
            <div class="dossier-hint">Click for manager dossier</div>`;
          card.addEventListener('click',()=>openOverlay(managerId,manager));
          card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openOverlay(managerId,manager)}});
          container.appendChild(card);
        }

        container.insertAdjacentHTML('beforeend',`<div class="ranking-card info-card" style="cursor:default">
          <div class="info-header">Point Assignment</div>
          <div class="info-desc">Rankings are weighted based on total performance. Click any manager card to open the complete career dossier.</div>
          <div class="stats-sub-grid">
            <div class="stat-item"><span class="stat-label">Win %</span><span class="stat-value">2.0</span></div>
            <div class="stat-item"><span class="stat-label">TPF</span><span class="stat-value">2.0</span></div>
            <div class="stat-item"><span class="stat-label">TPA</span><span class="stat-value">1.5</span></div>
            <div class="stat-item"><span class="stat-label">Playoffs</span><span class="stat-value">1.5</span></div>
            <div class="stat-item"><span class="stat-label">Champ App</span><span class="stat-value">1.0</span></div>
            <div class="stat-item"><span class="stat-label">Rings</span><span class="stat-value">2.0</span></div>
          </div>
        </div>`);
      }catch(error){
        console.error('Critical Error:',error);
        document.getElementById('leaderboard').innerHTML=`<p style="text-align:center;color:#fc8181;"><strong>Data Load Failed</strong><br>${error.message}</p>`;
      }
    }

    async function openOverlay(managerId,displayName){
      const overlay=document.getElementById('full-page-overlay');
      const target=document.getElementById('dossier-target');
      overlay.classList.remove('overlay-hidden');
      overlay.setAttribute('aria-hidden','false');
      document.body.classList.add('overlay-open');

      const h2hHtml=generateH2HRows(managerId);
      target.innerHTML=`
        <div class="dossier-loading">
          <div class="dossier-loading-title">LOADING DOSSIER...</div>
          <div class="dossier-loading-sub">Accessing TCWR career records for ${escapeHtml(displayName||managerId)}</div>
        </div>`;

      // Build a usable dossier even if Firebase is temporarily unavailable.
      // The H2H history is already embedded in this page; Firebase adds the career summary.
      let d={};
      let firebaseStatus='Live Firebase record';
      try{
        if(!db) throw new Error('Firestore is not initialized.');
        const doc=await db.collection('managers').doc(managerId).get();
        if(doc.exists){
          d=doc.data()||{};
        }else{
          firebaseStatus='Firebase record not found';
        }
      }catch(e){
        console.warn('Firebase dossier lookup failed; showing local dossier data instead:',e);
        firebaseStatus='Firebase temporarily unavailable';
      }

      const name=d.memberId||displayName||managerId;
      const currentRank=d.rank||'N/A';
      const currentScore=d.totalScore||'N/A';
      const currentWinPct=d.winPct||'N/A';

      target.innerHTML=`
        <div class="dossier-header">
          <h1>${escapeHtml(name)}</h1>
          <div class="dossier-subtitle">TCWR Dynasty Manager Dossier · ${escapeHtml(firebaseStatus)}</div>
        </div>
        <div class="dossier-grid">
          <div class="dossier-stack">
            <div class="dossier-section">
              <h3>Manager Stats</h3>
              <div class="manager-stat-list">
                <div class="manager-stat"><span class="manager-stat-label">Seasons</span><span class="manager-stat-value">${escapeHtml(d.seasons||'N/A')}</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Current Rank</span><span class="manager-stat-value">#${escapeHtml(currentRank)}</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Career Record</span><span class="manager-stat-value">${escapeHtml(d.careerRecord||'N/A')}</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Career Win %</span><span class="manager-stat-value">${escapeHtml(currentWinPct)}</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Avg PPG</span><span class="manager-stat-value">${escapeHtml(d.careerAvg||'N/A')}</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Playoffs</span><span class="manager-stat-value">${escapeHtml(d.playoffAppearances||'N/A')}</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Championships</span><span class="manager-stat-value">${escapeHtml(d.championships||'0')} 🏆</span></div>
                <div class="manager-stat"><span class="manager-stat-label">Ranking Score</span><span class="manager-stat-value">${escapeHtml(currentScore)}${currentScore!=='N/A'?' / 10':''}</span></div>
              </div>
            </div>
          </div>
          <div class="dossier-section">
            <h3>Head-to-Head History</h3>
            <div class="h2h-scroll">
              <table>
                <thead><tr><th>Opponent</th><th>Rec</th><th>Total PF</th><th>Avg</th><th>Diff</th></tr></thead>
                <tbody>${h2hHtml}</tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    function generateH2HRows(managerId){
      const data=managerDataStore[managerId]||[];
      if(!data.length)return '<tr><td colspan="5" style="text-align:center;color:#8fa8bd;padding:28px;">No head-to-head history available.</td></tr>';
      return data.map(r=>`<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(r[1])}</td><td>${escapeHtml(r[2])}</td><td>${escapeHtml(r[3])}</td><td style="font-weight:bold;color:${String(r[4]).startsWith('+')?'#4ade80':'#f87171'}">${escapeHtml(r[4])}</td></tr>`).join('');
    }

    function escapeHtml(value){
      return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function closeOverlay(){
      const overlay=document.getElementById('full-page-overlay');overlay.classList.add('overlay-hidden');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('overlay-open');
    }

    const sheetModal=document.getElementById('sheetModal');
    const openModalBtn=document.getElementById('openModalBtn');
    const closeModalBtn=document.getElementById('closeModalBtn');
    function openAlgorithm(){sheetModal.style.display='grid';requestAnimationFrame(()=>{sheetModal.style.opacity='1';sheetModal.style.pointerEvents='auto';sheetModal.setAttribute('aria-hidden','false')});document.body.classList.add('overlay-open')}
    function closeAlgorithm(){sheetModal.style.opacity='0';sheetModal.style.pointerEvents='none';sheetModal.setAttribute('aria-hidden','true');setTimeout(()=>{if(sheetModal.getAttribute('aria-hidden')==='true')sheetModal.style.display='none'},300);document.body.classList.remove('overlay-open')}
    openModalBtn.addEventListener('click',openAlgorithm);closeModalBtn.addEventListener('click',closeAlgorithm);sheetModal.addEventListener('click',e=>{if(e.target===sheetModal)closeAlgorithm()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('full-page-overlay').classList.contains('overlay-hidden'))closeOverlay();else if(sheetModal.getAttribute('aria-hidden')==='false')closeAlgorithm()}});
    document.getElementById('full-page-overlay').addEventListener('click',e=>{if(e.target.id==='full-page-overlay')closeOverlay()});
    fetchAndDisplayRankings();

  </script>
</body>
</html>
