<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061426" />
    <title>TCWR FANTASY FOOTBALL DY-NASTY MANAGER RANKINGS</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;600;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    

<style>
:root{
  --n950:#020914;
  --n900:#061426;
  --n850:#081b31;
  --n800:#0b2440;
  --blue:#45a8ef;
  --cyan:#79d8ff;
  --red:#ff7478;
  --orange:#f8a93d;
  --gold:#ffd56b;
  --green:#4ade80;
  --silver:#d9e2ec;
  --bronze:#d89a62;
  --white:#f7fbff;
  --muted:#a8bdd2;
  --line:rgba(142,205,255,.18);
  --shadow:0 24px 70px rgba(0,0,0,.48);
  --radius-xl:28px;
  --radius-lg:20px;
  --radius-md:14px;
}

*{box-sizing:border-box}

html{
  min-height:100%;
  background:var(--n950);
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  margin:0;
  padding:0 0 110px;
  overflow-x:hidden;
  color:var(--white);
  font-family:"Montserrat","Inter",sans-serif;
  background:
    linear-gradient(rgba(2,9,20,.82),rgba(2,9,20,.96)),
    url("bylawsbackground.jpeg") center/cover fixed,
    radial-gradient(circle at 50% 12%,rgba(35,134,216,.24),transparent 32%),
    linear-gradient(160deg,var(--n950),var(--n900) 48%,#071d34);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent 49.85%,rgba(121,216,255,.1) 50%,transparent 50.15%),
    repeating-linear-gradient(90deg,transparent 0,transparent 119px,rgba(255,255,255,.015) 120px);
  mask-image:linear-gradient(to bottom,black,transparent 92%);
}

body::after{
  content:"";
  position:fixed;
  top:-28vh;
  left:50%;
  width:58vw;
  height:110vh;
  transform:translateX(-50%);
  z-index:-4;
  pointer-events:none;
  opacity:.32;
  background:linear-gradient(180deg,rgba(92,190,255,.28),rgba(92,190,255,.06) 52%,transparent 82%);
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
  filter:blur(18px);
  animation:beamPulse 6s ease-in-out infinite;
}

.top-bar{
  width:min(1480px,calc(100% - 36px));
  min-height:72px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border-bottom:1px solid rgba(142,205,255,.16);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brand-mark{
  width:44px;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid rgba(255,213,107,.58);
  border-radius:50%;
  color:var(--gold);
  font-family:"Barlow Condensed",sans-serif;
  font-size:1rem;
  font-weight:900;
  letter-spacing:.04em;
  background:linear-gradient(145deg,rgba(244,190,61,.28),rgba(244,190,61,.03));
  box-shadow:inset 0 0 18px rgba(244,190,61,.1),0 0 24px rgba(244,190,61,.08);
}

.brand-name,.brand-subtitle{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-name{
  font-family:"Barlow Condensed",sans-serif;
  font-size:1.16rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.brand-subtitle{
  margin-top:2px;
  color:var(--muted);
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.status-chip{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:9px 13px;
  border:1px solid rgba(142,205,255,.2);
  border-radius:999px;
  color:#c9e7fa;
  background:rgba(9,33,58,.72);
  font-family:"Barlow Condensed",sans-serif;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.status-chip::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 12px rgba(255,116,120,.8);
  animation:statusBlink 1.7s ease-in-out infinite;
}

main{
  width:min(1480px,calc(100% - 36px));
  margin:0 auto;
  padding:clamp(30px,5vw,64px) 0 44px;
}

.section-heading{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:24px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(142,205,255,.14);
}

.heading-kicker{
  color:var(--orange);
  font-family:"Barlow Condensed",sans-serif;
  font-size:.76rem;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.heading-title{
  margin:4px 0 0;
  font-family:"Barlow Condensed",sans-serif;
  font-size:clamp(2.2rem,4.5vw,4rem);
  line-height:.94;
  font-weight:900;
  letter-spacing:.01em;
  text-transform:uppercase;
}

.heading-chip{
  flex:0 0 auto;
  padding:8px 12px;
  border:1px solid rgba(248,169,61,.32);
  border-radius:999px;
  color:#ffd28f;
  background:rgba(65,34,8,.32);
  font-family:"Barlow Condensed",sans-serif;
  font-size:.82rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.ranking-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(18px,2vw,26px);
  width:100%;
  margin:0;
  align-items:stretch;
}

.ranking-grid>p{
  grid-column:1/-1;
  margin:0;
  padding:42px 20px;
  border:1px solid rgba(142,205,255,.16);
  border-radius:var(--radius-lg);
  color:#8fa8bd;
  background:rgba(4,18,33,.6);
}

.ranking-card{
  --rank-accent:var(--blue);
  position:relative;
  min-height:355px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:26px 22px 22px;
  border:1px solid rgba(142,205,255,.2);
  border-radius:var(--radius-lg);
  background:linear-gradient(150deg,rgba(17,55,91,.82),rgba(4,18,33,.95));
  box-shadow:0 18px 42px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}

.ranking-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  height:4px;
  background:linear-gradient(90deg,transparent,var(--rank-accent),transparent);
}

.ranking-card:hover{
  transform:translateY(-6px);
  border-color:color-mix(in srgb,var(--rank-accent) 70%,transparent);
  box-shadow:0 24px 54px rgba(0,0,0,.43),0 0 24px color-mix(in srgb,var(--rank-accent) 12%,transparent);
}

.ranking-card[data-rank="1"]{
  --rank-accent:var(--gold);
  background:
    radial-gradient(circle at 85% 12%,rgba(255,213,107,.18),transparent 30%),
    linear-gradient(150deg,rgba(76,58,13,.86),rgba(20,17,6,.96));
}

.ranking-card[data-rank="2"]{
  --rank-accent:var(--silver);
  background:
    radial-gradient(circle at 85% 12%,rgba(217,226,236,.15),transparent 30%),
    linear-gradient(150deg,rgba(48,61,75,.86),rgba(10,18,28,.96));
}

.ranking-card[data-rank="3"]{
  --rank-accent:var(--bronze);
  background:
    radial-gradient(circle at 85% 12%,rgba(216,154,98,.16),transparent 30%),
    linear-gradient(150deg,rgba(77,45,25,.86),rgba(24,13,8,.96));
}

.rank-number{
  position:absolute;
  top:16px;
  right:16px;
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border:1px solid color-mix(in srgb,var(--rank-accent) 65%,transparent);
  border-radius:50%;
  color:var(--rank-accent);
  background:rgba(2,9,20,.46);
  box-shadow:0 0 18px color-mix(in srgb,var(--rank-accent) 16%,transparent);
  font-family:"Barlow Condensed",sans-serif;
  font-size:1.15rem;
  font-weight:900;
}

.manager-info{
  margin-bottom:16px;
  padding:5px 62px 15px 0;
  border-bottom:1px solid rgba(142,205,255,.12);
}

.real-name{
  display:block;
  color:var(--white);
  font-family:"Barlow Condensed",sans-serif;
  font-size:clamp(1.7rem,2.6vw,2.2rem);
  line-height:.95;
  font-weight:900;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.total-score{
  margin:8px 0 18px;
  color:var(--green);
  font-family:"Barlow Condensed",sans-serif;
  font-size:3.25rem;
  line-height:1;
  font-weight:900;
  letter-spacing:-.03em;
}

.total-score span{
  margin-left:3px;
  color:#8fa8bd;
  font-family:"Montserrat",sans-serif;
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.04em;
}

.stats-sub-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:auto;
  padding:14px;
  border:1px solid rgba(142,205,255,.1);
  border-radius:var(--radius-md);
  background:rgba(2,9,20,.34);
}

.stat-item{
  min-width:0;
  padding:9px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.025);
}

.stat-label{
  display:block;
  margin-bottom:4px;
  color:#7891a7;
  font-family:"Barlow Condensed",sans-serif;
  font-size:.66rem;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.stat-value{
  display:block;
  color:var(--gold);
  font-family:"Barlow Condensed",sans-serif;
  font-size:1.15rem;
  font-weight:900;
}

.win-bar-container{
  width:100%;
  height:8px;
  margin-top:18px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(2,9,20,.72);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.45);
}

.win-bar-fill{
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--blue),var(--green));
  box-shadow:0 0 12px rgba(74,222,128,.34);
  transition:width 1.5s cubic-bezier(.175,.885,.32,1.275);
}

.info-card{
  --rank-accent:var(--green);
  background:
    radial-gradient(circle at 85% 12%,rgba(74,222,128,.13),transparent 30%),
    linear-gradient(150deg,rgba(16,69,65,.78),rgba(4,18,33,.95));
}

.info-header{
  margin-bottom:8px;
  color:var(--green);
  font-family:"Barlow Condensed",sans-serif;
  font-size:2rem;
  line-height:1;
  font-weight:900;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.info-desc{
  margin-bottom:17px;
  color:#b6c9d9;
  font-size:.86rem;
  line-height:1.55;
}

.footer-action-container{
  position:fixed;
  inset:auto 0 0;
  z-index:100;
  display:flex;
  justify-content:center;
  padding:18px 16px 20px;
  pointer-events:none;
  background:linear-gradient(to top,rgba(2,9,20,1) 52%,rgba(2,9,20,0));
}

.embed-trigger-btn{
  min-height:48px;
  padding:11px 22px;
  border:1px solid rgba(74,222,128,.48);
  border-radius:999px;
  color:#eafff0;
  background:linear-gradient(135deg,#159447,#0a6a36);
  box-shadow:0 14px 30px rgba(10,106,54,.34);
  cursor:pointer;
  pointer-events:auto;
  font-family:"Barlow Condensed",sans-serif;
  font-size:.9rem;
  font-weight:900;
  letter-spacing:.1em;
  text-transform:uppercase;
  transition:transform .2s ease,filter .2s ease,box-shadow .2s ease;
}

.embed-trigger-btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.12);
  box-shadow:0 18px 36px rgba(10,106,54,.44);
}

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  padding:clamp(10px,3vw,32px);
  opacity:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%,rgba(35,134,216,.18),transparent 35%),
    rgba(1,5,12,.94);
  backdrop-filter:blur(14px);
  transition:opacity .3s ease;
}

.modal-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.modal-content{
  position:relative;
  width:min(1200px,100%);
  height:min(82vh,820px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(255,213,107,.46);
  border-radius:var(--radius-xl);
  background:linear-gradient(145deg,rgba(12,43,72,.98),rgba(3,14,27,.99));
  box-shadow:0 30px 100px rgba(0,0,0,.72),0 0 38px rgba(255,213,107,.08);
  transform:translateY(20px) scale(.985);
  transition:transform .3s ease;
}

.modal-content::before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  z-index:2;
  height:4px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.modal-overlay.active .modal-content{
  transform:translateY(0) scale(1);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px 20px;
  border-bottom:1px solid rgba(142,205,255,.13);
  background:rgba(2,9,20,.34);
}

.modal-title{
  margin:0;
  color:var(--gold);
  font-family:"Barlow Condensed",sans-serif;
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.modal-close-btn{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid rgba(255,213,107,.35);
  border-radius:50%;
  color:var(--gold);
  background:rgba(2,9,20,.44);
  font-size:1.8rem;
  line-height:1;
  cursor:pointer;
  transition:transform .2s ease,background .2s ease;
}

.modal-close-btn:hover{
  transform:rotate(90deg);
  background:rgba(255,213,107,.1);
}

.modal-body{
  flex:1;
  min-height:0;
  width:100%;
}

.modal-body iframe{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

@keyframes beamPulse{
  0%,100%{opacity:.25;transform:translateX(-50%) scaleX(.94)}
  50%{opacity:.44;transform:translateX(-50%) scaleX(1.04)}
}

@keyframes statusBlink{
  0%,100%{opacity:.45}
  50%{opacity:1}
}

@media(max-width:1180px){
  .ranking-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(max-width:900px){
  .ranking-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:650px){
  .top-bar,main{
    width:min(100% - 24px,1480px);
  }

  .brand-subtitle,.status-chip span{display:none}

  .section-heading{
    align-items:flex-start;
    flex-direction:column;
  }

  .ranking-grid{
    grid-template-columns:1fr;
    gap:18px;
  }

  .ranking-card{
    min-height:0;
  }

  .modal-overlay{padding:8px}
  .modal-content{
    height:calc(100vh - 16px);
    border-radius:19px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>

</head>

<body>
<header class="top-bar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">TCWR</div>
    <div>
      <span class="brand-name">TCWR Dynasty League</span>
      <span class="brand-subtitle">Manager Performance Index</span>
    </div>
  </div>
  <div class="status-chip"><span>Official Rankings</span></div>
</header>

<main>
  <header class="section-heading">
    <div>
      <div class="heading-kicker">League Performance Database</div>
      <h1 class="heading-title">Manager Rankings</h1>
    </div>
    <div class="heading-chip">Weighted Score / 10</div>
  </header>

<div class="ranking-grid" id="leaderboard">
    <p style="text-align: center; grid-column: 1/-1;">Loading rankings...</p>
</div>
</main>

<div class="footer-action-container">
    <button class="embed-trigger-btn" id="openModalBtn">The Ranking Algorithm</button>
</div>

<div class="modal-overlay" id="sheetModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">TCWR DY-NASTY Manager Ranking Algorithm</h3>
            <button class="modal-close-btn" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQjIjcUVkLUwsSErcmBR-WHYSu6WxbAlckp2oZOGkDQFoqea7El8QLa2shDlyrUPSAXZtv89DzcMcvk/pubhtml?widget=true&amp;headers=false&amp;chrome=false"></iframe>
        </div>
    </div>
</div>

<script>
const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjIjcUVkLUwsSErcmBR-WHYSu6WxbAlckp2oZOGkDQFoqea7El8QLa2shDlyrUPSAXZtv89DzcMcvk/pub?gid=242455735&single=true&output=csv';

async function fetchAndDisplayRankings() {
    console.log("Status: Fetching CSV data directly..."); 
    try {
        // Fetching directly from Google
        const response = await fetch(sheetUrl); 
        
        if (!response.ok) throw new Error(`Network error: ${response.status}`);

        const csvText = await response.text(); 
        
        // 2. The Parser
        const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "").map(row => {
            const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            return matches ? matches.map(cell => cell.replace(/^"(.*)"$/, '$1').trim()) : [];
        });

        const container = document.getElementById('leaderboard');
        container.innerHTML = "";

       // 3. The Loop (Starting at Row 4 / Index 3)
        for (let i = 3; i < rows.length; i++) {
            const col = rows[i];
            
            // Skip rows that don't have a valid Rank in Column A
            if (!col[0] || isNaN(col[0])) continue; 

            const rank = col[0];        // Column A (Index 0)
            const manager = col[1];     // Column B (Index 1)
            const totalScore = col[2];  // Column C (Index 2)
            
            // Shifting indices to fix the "one column to the right" issue
            const winPctPts = col[6];   // Column H 
            const tpfPts = col[8];      // Column J (Index 9)
            const tpaPts = col[10];     // Column L (Index 11)
            const playoffPts = col[12]; // Column N (Index 13)
            const champAppPts = col[14];// Column P (Index 15)
            const ringsPts = col[16];   // Column R (Index 17)

            container.innerHTML += `
                <div class="ranking-card" data-rank="${rank}">
                    <div class="rank-number">${rank}</div>
                    <div class="manager-info">
                        <span class="real-name">${manager}</span>
                    </div>
                    <div class="total-score">${totalScore} <span>/ 10</span></div>
                    
                    <div class="stats-sub-grid">
                        <div class="stat-item"><span class="stat-label">Win %</span><span class="stat-value">${winPctPts}</span></div>
                        <div class="stat-item"><span class="stat-label">TPF</span><span class="stat-value">${tpfPts}</span></div>
                        <div class="stat-item"><span class="stat-label">TPA</span><span class="stat-value">${tpaPts}</span></div>
                        <div class="stat-item"><span class="stat-label">Playoffs</span><span class="stat-value">${playoffPts}</span></div>
                        <div class="stat-item"><span class="stat-label">Champ App</span><span class="stat-value">${champAppPts}</span></div>
                        <div class="stat-item"><span class="stat-label">Rings</span><span class="stat-value">${ringsPts}</span></div>
                    </div>

                    <div class="win-bar-container">
                        <div class="win-bar-fill" style="width: ${parseFloat(totalScore) * 10}%"></div>
                    </div>
                </div>`;
        }
        container.innerHTML += `
            <div class="ranking-card info-card">
                <div class="info-header">Point Assignment</div>
                <div class="info-desc">Rankings are weighted based on total performance.</div>
                <div class="stats-sub-grid">
                    <div class="stat-item"><span class="stat-label">Win %</span><span class="stat-value">2.0</span></div>
                    <div class="stat-item"><span class="stat-label">TPF</span><span class="stat-value">2.0</span></div>
                    <div class="stat-item"><span class="stat-label">TPA</span><span class="stat-value">1.5</span></div>
                    <div class="stat-item"><span class="stat-label">Playoffs</span><span class="stat-value">1.5</span></div>
                    <div class="stat-item"><span class="stat-label">Champ App</span><span class="stat-value">1.0</span></div>
                    <div class="stat-item"><span class="stat-label">Rings</span><span class="stat-value">2.0</span></div>
                </div>
            </div>`;

    } catch (error) {
        console.error("Critical Error:", error);
        document.getElementById('leaderboard').innerHTML = 
            `<p style="text-align:center; color:#fc8181;"><strong>Data Load Failed</strong><br>${error.message}</p>`;
    }
}

// --- Modal Control Functionality ---
const modal = document.getElementById('sheetModal');
const openBtn = document.getElementById('openModalBtn');
const closeBtn = document.getElementById('closeModalBtn');

openBtn.addEventListener('click', () => {
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
});

closeBtn.addEventListener('click', () => {
    modal.classList.remove('active');
    document.body.style.overflow = ''; // Re-enables background scrolling
});

// Close modal if user clicks outside the dashboard wrapper box
modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }
});

fetchAndDisplayRankings();

<script>
(() => {
  "use strict";
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      modal.classList.remove("active");
      document.body.style.overflow = "";
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch((error) => {
        console.info("Service worker was not registered:", error);
      });
    });
  }
})();
</script>
