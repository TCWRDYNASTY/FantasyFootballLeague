<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCWR 100-YARD DRAFT DASH</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=Montserrat:wght@600;700;800&display=swap');

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#071522;
  color:#fff;
  font-family:Montserrat,Arial,sans-serif;
}

.wrap{
  max-width:1400px;
  margin:auto;
  padding:24px;
}

h1{
  font:900 clamp(32px,5vw,64px)/.95 "Barlow Condensed",sans-serif;
  letter-spacing:1px;
  text-align:center;
  margin:0 0 8px;
}

.sub{
  text-align:center;
  color:#d8b45a;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:20px;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:18px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 20px;
  font-weight:800;
  cursor:pointer;
}

#start{
  background:#d8b45a;
  color:#071522;
}

#reset{
  background:#243746;
  color:#fff;
}


/* =========================================================
   PANELS
   ========================================================= */

.panel{
  background:#0c1d2b;
  border:1px solid #294354;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}


/* =========================================================
   TEAM EDITOR
   ========================================================= */

.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.team-edit{
  display:grid;
  grid-template-columns:minmax(120px,1fr) 75px minmax(160px,1.4fr);
  gap:8px;
  align-items:center;
}

.team-edit input{
  width:100%;
  padding:9px;
  border-radius:6px;
  border:1px solid #405765;
  background:#081722;
  color:#fff;
  font-family:Montserrat,Arial,sans-serif;
}

.team-edit input::placeholder{
  color:#7e919d;
}


/* =========================================================
   FIELD
   ========================================================= */

.field{
  position:relative;

  width:100%;

  /*
     racefield.png is a wide football field.
     Keep the container at the same proportions.
  */

  aspect-ratio:2 / 1;

  overflow:hidden;

  border-radius:14px;
  border:5px solid #fff;

  background-image:url("racefield.png");
  background-position:center center;
  background-repeat:no-repeat;
  background-size:100% 100%;
}


/* =========================================================
   STATUS
   ========================================================= */

.status{
  text-align:center;
  min-height:24px;

  font-weight:800;
  color:#d8b45a;

  margin:8px;
}


/* =========================================================
   RUNNER
   ========================================================= */

.runner{
  position:absolute;

  /*
     The runner itself stays inside the field.
  */

  left:8%;

  transform:translateY(-50%);

  z-index:10;

  transition:left .15s linear;
}


/* =========================================================
   PLAYER IMAGE
   ========================================================= */

.player-image{
  display:block;

  width:58px;
  height:58px;

  object-fit:cover;

  border-radius:50%;

  border:3px solid #d8b45a;

  background:#071522;

  box-shadow:
    2px 3px 5px rgba(0,0,0,.55);
}


/*
   If you want square images instead of circular
   portraits, change border-radius to 8px.
*/


/* =========================================================
   NAME / ODDS TAG
   ========================================================= */

.tag{
  position:absolute;

  left:66px;
  top:50%;

  transform:translateY(-50%);

  white-space:nowrap;

  background:rgba(4,14,23,.92);

  padding:8px 10px;

  border-radius:6px;

  font:800 14px "Barlow Condensed",sans-serif;

  border-left:4px solid #d8b45a;

  box-shadow:
    2px 3px 5px rgba(0,0,0,.4);

  z-index:20;
}


/* =========================================================
   RESULTS
   ========================================================= */

.results{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.result-list{
  list-style:none;
  padding:0;
  margin:0;
}

.result-list li{
  display:flex;
  justify-content:space-between;

  padding:9px 10px;

  border-bottom:1px solid #294354;
}

.result-list li:first-child{
  color:#d8b45a;
  font-size:1.08em;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

  .teams{
    grid-template-columns:1fr;
  }

  .team-edit{
    grid-template-columns:
      minmax(110px,1fr)
      70px
      minmax(150px,1.5fr);
  }
}


@media(max-width:560px){

  .wrap{
    padding:12px;
  }

  .team-edit{
    grid-template-columns:1fr 65px;
  }

  .team-edit input[data-type="image"]{
    grid-column:1 / -1;
  }

  .field{
    aspect-ratio:2 / 1;
  }

  .player-image{
    width:44px;
    height:44px;
  }

  .tag{
    left:50px;
    font-size:11px;
    padding:6px 7px;
  }
}

</style>
</head>


<body>

<div class="wrap">

<h1>TCWR 100-YARD DRAFT DASH</h1>

<div class="sub">
  WEIGHTED ODDS • 8 RUNNERS • DRAFT ORDER
</div>


<!-- =======================================================
     CONTROLS
     ======================================================= -->

<div class="controls">

  <button id="start">
    START THE RACE
  </button>

  <button id="reset">
    RESET
  </button>

</div>


<div id="status" class="status">
  Ready at the starting line.
</div>


<!-- =======================================================
     TEAM EDITOR
     ======================================================= -->

<div class="panel">

  <div class="teams" id="teamInputs"></div>

</div>


<!-- =======================================================
     FOOTBALL FIELD
     ======================================================= -->

<div class="field" id="field"></div>


<!-- =======================================================
     DRAFT ORDER
     ======================================================= -->

<div class="results">

  <div class="panel">

    <h2>
      Draft Order
    </h2>

    <ol id="draftOrder" class="result-list"></ol>

  </div>

</div>

</div>


<script>


/* =========================================================
   DEFAULT TEAMS
   =========================================================

   IMAGE URL:
   Paste your GitHub RAW image URL here.

   Example:

   https://raw.githubusercontent.com/USERNAME/REPO/main/images/matt.png

   You can also enter the URLs directly on the website
   using the Image URL boxes.
*/

const defaultTeams = [

  {
    id:1,
    name:"Matt",
    weight:18,
    image:""
  },

  {
    id:2,
    name:"Steven",
    weight:15,
    image:""
  },

  {
    id:3,
    name:"Jess",
    weight:13,
    image:""
  },

  {
    id:4,
    name:"Kevin",
    weight:11,
    image:""
  },

  {
    id:5,
    name:"Sarah",
    weight:10,
    image:""
  },

  {
    id:6,
    name:"Mike",
    weight:9,
    image:""
  },

  {
    id:7,
    name:"Chris",
    weight:8,
    image:""
  },

  {
    id:8,
    name:"Amanda",
    weight:7,
    image:""
  }

];


let teams =
  defaultTeams.map(x => ({...x}));


let runners = [];

let raceRunning = false;

let raf = 0;


/* =========================================================
   TEAM INPUTS
   ========================================================= */

const inputs =
  document.getElementById("teamInputs");


function renderInputs(){

  inputs.innerHTML = "";

  teams.forEach((t)=>{

    const box =
      document.createElement("div");

    box.className =
      "team-edit";

    box.innerHTML = `

      <input
        data-id="${t.id}"
        data-type="name"
        value="${escapeHTML(t.name)}"
        placeholder="Team name"
      >

      <input
        data-id="${t.id}"
        data-type="weight"
        type="number"
        min="1"
        value="${t.weight}"
      >

      <input
        data-id="${t.id}"
        data-type="image"
        value="${escapeHTML(t.image)}"
        placeholder="GitHub image URL"
      >

    `;

    inputs.appendChild(box);

  });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   UPDATE TEAM DATA
   ========================================================= */

inputs.addEventListener(
  "input",
  e => {

    const id =
      +e.target.dataset.id;

    const t =
      teams.find(
        x => x.id === id
      );

    if(!t)
      return;


    const type =
      e.target.dataset.type;


    if(type === "name"){

      t.name =
        e.target.value;

    }


    else if(type === "weight"){

      t.weight =
        Math.max(
          1,
          +e.target.value || 1
        );

    }


    else if(type === "image"){

      t.image =
        e.target.value;

    }

  }
);


/* =========================================================
   WEIGHTED RANDOM SELECTION
   ========================================================= */

function weightedPick(pool){

  const total =
    pool.reduce(
      (s,t) =>
        s + t.weight,
      0
    );


  let r =
    Math.random() * total;


  for(const t of pool){

    r -= t.weight;

    if(r <= 0)
      return t;

  }


  return pool[pool.length - 1];

}


/* =========================================================
   CREATE DRAFT ORDER
   ========================================================= */

function createOrder(){

  let pool =
    teams.map(
      t => ({...t})
    );

  const order = [];


  while(pool.length){

    const winner =
      weightedPick(pool);

    order.push(winner);


    pool =
      pool.filter(
        t =>
          t.id !== winner.id
      );

  }


  return order;

}


/* =========================================================
   RESET
   ========================================================= */

function reset(){

  cancelAnimationFrame(raf);

  raceRunning =
    false;


  document.getElementById(
    "status"
  ).textContent =
    "Ready at the starting line.";


  document.getElementById(
    "draftOrder"
  ).innerHTML = "";


  document
    .querySelectorAll(".runner")
    .forEach(
      x => x.remove()
    );

}


/* =========================================================
   CREATE RUNNER
   ========================================================= */

function addRunner(t,i){

  const el =
    document.createElement("div");

  el.className =
    "runner";


  /*
     Keep every player safely inside
     the vertical boundaries.

     12% → 88%
  */

  el.style.top =
    (
      12 +
      i * (76 / 7)
    ) + "%";


  /*
     Start inside the LEFT END ZONE.
  */

  el.style.left =
    "8%";


  /*
     Player image.
     If no image is entered, use a simple
     colored placeholder.
  */

  const imageHTML =
    t.image
      ? `
        <img
          class="player-image"
          src="${escapeHTML(t.image)}"
          alt="${escapeHTML(t.name)}"
          onerror="this.style.display='none';"
        >
      `
      : `
        <div
          class="player-image"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:900;
            color:#fff;
          "
        >
          ${escapeHTML(
            t.name
              .charAt(0)
              .toUpperCase()
          )}
        </div>
      `;


  el.innerHTML = `

    ${imageHTML}

    <div class="tag">
      ${escapeHTML(t.name)}
      •
      ${t.weight}%
    </div>

  `;


  document
    .getElementById("field")
    .appendChild(el);


  return el;

}


/* =========================================================
   START RACE
   ========================================================= */

function start(){

  if(raceRunning)
    return;


  reset();


  raceRunning =
    true;


  /*
     Create weighted draft order.
  */

  const order =
    createOrder();


  /*
     Create all runners.
  */

  runners =
    teams.map(
      (t,i) => ({

        team:t,

        el:addRunner(t,i),

        finish:0,

        revealed:false

      })
    );


  const min =
    Math.min(
      ...teams.map(
        t => t.weight
      )
    );


  const max =
    Math.max(
      ...teams.map(
        t => t.weight
      )
    );


  /*
     Assign finish times.

     Higher weighted teams have
     a somewhat better chance of
     finishing earlier.
  */

  order.forEach(
    (t,rank)=>{

      const runner =
        runners.find(
          x =>
            x.team.id === t.id
        );


      const norm =
        max === min

          ? .5

          : (
              (t.weight - min) /
              (max - min)
            );


      const jitter =
        (
          Math.random() - .5
        ) * 6000;


      runner.finish =
        Math.max(
          3000,

          42000
          - rank * 1500
          - norm * 4500
          + jitter
        );

    }
  );


  const list =
    document.getElementById(
      "draftOrder"
    );


  list.innerHTML =
    "";


  document.getElementById(
    "status"
  ).textContent =
    "GO! They're off!";


  const startTime =
    performance.now();


  /* =======================================================
     REVEAL FINISHER
     ======================================================= */

  function revealRunner(r){

    if(r.revealed)
      return;


    r.revealed =
      true;


    const position =
      list.children.length + 1;


    const li =
      document.createElement("li");


    li.innerHTML = `

      <span>
        <strong>
          #${position}
        </strong>

        ${escapeHTML(
          r.team.name
        )}
      </span>

      <span>
        ${r.team.weight}% odds
      </span>

    `;


    list.appendChild(li);

  }


  /* =======================================================
     ANIMATION LOOP
     ======================================================= */

  function frame(now){

    const elapsed =
      now - startTime;


    runners.forEach(
      r => {

        const finishTime =
          Math.max(
            3000,
            r.finish
          );


        const target =
          Math.min(
            1,
            elapsed / finishTime
          );


        /*
           Acceleration curve
        */

        const eased =

          target < .18

            ? target * .65

            : target < .65

              ? .117 +
                (target - .18) * .93

              : .554 +
                (target - .65) * 1.28;


        /*
           FIELD POSITION

           Start:
           8%

           Finish:
           84%

           This keeps the actual player
           completely inside the image.
        */

        const startPosition =
          8;

        const finishPosition =
          84;


        const currentPosition =
          startPosition +

          Math.min(
            finishPosition -
              startPosition,

            eased *
              (
                finishPosition -
                startPosition
              )
          );


        r.el.style.left =
          currentPosition + "%";


        /*
           FINISHED
        */

        if(
          elapsed >= finishTime
        ){

          /*
             Keep the actual player
             inside the right end zone.
          */

          r.el.style.left =
            "84%";


          revealRunner(r);

        }

      }
    );


    /*
       Stop when everyone has finished.
    */

    if(
      runners.every(
        r => r.revealed
      )
    ){

      raceRunning =
        false;


      document.getElementById(
        "status"
      ).textContent =
        "DRAFT ORDER COMPLETE";


      return;

    }


    raf =
      requestAnimationFrame(
        frame
      );

  }


  raf =
    requestAnimationFrame(
      frame
    );

}


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById(
  "start"
).onclick =
  start;


document.getElementById(
  "reset"
).onclick =
  () => {

    reset();

    renderInputs();

  };


/* =========================================================
   INITIALIZE
   ========================================================= */

renderInputs();

</script>

</body>
</html>
