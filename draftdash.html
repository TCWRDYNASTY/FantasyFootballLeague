*{

.sub{
  text-align:center;
  color:#d8b45a;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:20px;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:18px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 20px;
  font-weight:800;
  cursor:pointer;
}

#start{
  background:#d8b45a;
  color:#071522;
}

#reset{
  background:#243746;
  color:#fff;
}


/* =========================================================
   PANELS
   ========================================================= */

.panel{
  background:#0c1d2b;
  border:1px solid #294354;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}


/* =========================================================
   TEAM EDITOR
   ========================================================= */

.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.team-edit{
  display:grid;
  grid-template-columns:minmax(120px,1fr) 75px minmax(160px,1.4fr);
  gap:8px;
  align-items:center;
}

.team-edit input{
  width:100%;
  padding:9px;
  border-radius:6px;
  border:1px solid #405765;
  background:#081722;
  color:#fff;
  font-family:Montserrat,Arial,sans-serif;
}

.team-edit input::placeholder{
  color:#7e919d;
}


/* =========================================================
   FIELD
   ========================================================= */

.field{
  position:relative;

  width:100%;

  /*
     racefield.png is the football field image.
  */

  aspect-ratio:2 / 1;

  overflow:hidden;

  border-radius:14px;
  border:5px solid #fff;

  background-image:url("racefield.png");
  background-position:center center;
  background-repeat:no-repeat;
  background-size:100% 100%;
}


/* =========================================================
   STATUS
   ========================================================= */

.status{
  text-align:center;
  min-height:24px;

  font-weight:800;
  color:#d8b45a;

  margin:8px;
}


/* =========================================================
   RUNNER
   ========================================================= */

.runner{
  position:absolute;

  left:8%;

  transform:translateY(-50%);

  z-index:10;

  transition:left .15s linear;
}


/* =========================================================
   PLAYER IMAGE
   ========================================================= */

.player-image{
  display:block;

  width:58px;
  height:58px;

  object-fit:cover;

  border-radius:50%;

  border:3px solid #d8b45a;

  background:#071522;

  box-shadow:
    2px 3px 5px rgba(0,0,0,.55);
}


/* =========================================================
   NAME / ODDS TAG
   ========================================================= */

.tag{
  position:absolute;

  left:66px;
  top:50%;

  transform:translateY(-50%);

  white-space:nowrap;

  background:rgba(4,14,23,.92);

  padding:8px 10px;

  border-radius:6px;

  font:800 14px "Barlow Condensed",sans-serif;

  border-left:4px solid #d8b45a;

  box-shadow:
    2px 3px 5px rgba(0,0,0,.4);

  z-index:20;
}


/* =========================================================
   RESULTS
   ========================================================= */

.results{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.result-list{
  list-style:none;
  padding:0;
  margin:0;
}

.result-list li{
  display:flex;
  justify-content:space-between;

  padding:9px 10px;

  border-bottom:1px solid #294354;
}

.result-list li:first-child{
  color:#d8b45a;

/* =========================================================

@media(max-width:900px){

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================
   WEIGHTED DRAW
   ========================================================= */

function weightedPick(pool){

  if(
    !Array.isArray(pool) ||
    pool.length === 0
  ){

    return null;

  }


  const cleanPool =
    pool.filter(
      team =>
        Number.isFinite(
          Number(team.weight)
        ) &&
        Number(team.weight) > 0
    );


  if(!cleanPool.length)
    return null;


  const totalWeight =
    cleanPool.reduce(
      (sum,team) =>
        sum +
        Number(team.weight),
      0
    );


  let random =
    Math.random() *
    totalWeight;


  for(
    const team of cleanPool
  ){

    random -=
      Number(team.weight);


    if(random <= 0){

      return team;

    }

  }


  return cleanPool[
    cleanPool.length - 1
  ];

}


/* =========================================================
   REVERSE-WEIGHTED DRAFT
   =========================================================

   Pick #8:
   weighted draw from all 8.

   Pick #7:
   weighted draw from remaining 7.

   Continue through Pick #2.

   Pick #1:
   last remaining team by elimination.
   ========================================================= */

function createReverseDraftOrder(){

  let pool =
    teams.map(
      team => ({
        ...team
      })
    );


  const order =
    [];


  for(
    let pick =
      teams.length;

    pick >= 2;

    pick--
  ){

    const winner =
      weightedPick(
        pool
      );


    if(!winner)
      break;


    order.push({

      pick,

      team:{
        ...winner
      }

    });


    /*
       Remove the selected team.

       IDs are compared as strings so this works
       whether Supabase returns numeric or text IDs.
    */

    pool =
      pool.filter(
        team =>
          String(team.id) !==
          String(winner.id)
      );

  }


  /*
     Last remaining team becomes Pick #1.
  */

  if(
    pool.length === 1
  ){

    order.push({

      pick:1,

      team:{
        ...pool[0]
      }

    });

  }


  return order;

}


/* =========================================================
   SUPABASE — LOAD TEAM CONFIGURATION
   ========================================================= */

async function loadTeamsFromSupabase(){

  const {
    data,
    error
  } =
    await supabase

      .from(
        SUPABASE_TABLE_NAME
      )

      .select(
        "id,members_data"
      );


  if(error){

    console.error(
      "Supabase team load error:",
      error
    );


    showStatus(
      "Using local teams — Supabase could not be loaded."
    );


    return defaultTeams.map(
      t => ({...t})
    );

  }


  if(
    !data ||
    !data.length
  ){

    return defaultTeams.map(
      t => ({...t})
    );

  }


  const loaded =
    data

      .map(
        row => {

          const d =
            row.members_data ||
            {};


          return {

            /*
               Preserve the actual Supabase ID.
            */

            id:
              String(row.id),

            name:
              d.name ||
              `Team ${row.id}`,

            weight:
              Number(d.weight) ||
              1,

            image:
              d.image ||
              "",

            originalWeightDisplay:
              d.originalWeightDisplay ||
              `${Number(d.weight) || 1}%`

          };

        }
      )

      .sort(
        (a,b) =>
          String(a.id).localeCompare(
            String(b.id),
            undefined,
            {
              numeric:true
            }
          )
      );


  return loaded.length

    ? loaded

    : defaultTeams.map(
        t => ({...t})
      );

}

async function saveTeamsToSupabase(){

  const rows =
    teams.map(
      team => ({

        id:
          team.id,

        members_data:{

          name:
            team.name,

          weight:
            Number(team.weight),

          image:
            team.image || "",

          originalWeightDisplay:
            `${team.weight}%`

        }

      })
    );


  const {
    error
  } =
    await supabase

      .from(
        SUPABASE_TABLE_NAME
      )

      .upsert(
        rows,
        {
          onConflict:"id"
        }
      );


  if(error){

    console.error(
      "Supabase save error:",
      error
    );


    showStatus(
      "Error saving configuration to Supabase."
    );


    return false;

  }


  return true;

}


/* =========================================================
   SUPABASE — SAVE DRAFT ORDER
   ========================================================= */

async function saveDraftOrderToSupabase(
  order
){

  const rows =
    order.map(
      item => ({

        id:
          `pick_${item.pick}`,

        order_data:{

          pick:
            item.pick,

          member:
            item.team.name,

          memberId:
            item.team.id,

          originalWeightDisplay:
            `${item.team.weight}%`

        }

      })
    );


  const {
    error
  } =
    await supabase

      .from(
        SUPABASE_ORDERS_TABLE_NAME
      )

      .upsert(
        rows,
        {
          onConflict:"id"
        }
      );


  if(error){

    console.error(
      "Supabase draft save error:",
      error
    );


    return false;

  }


  return true;

}


/* =========================================================
   SUPABASE — LOAD DRAFT ORDER
   ========================================================= */

async function loadDraftOrderFromSupabase(){

  const {
    data,
    error
  } =
    await supabase

      .from(
        SUPABASE_ORDERS_TABLE_NAME
      )

      .select(
        "order_data"
      );


  if(error){

    console.error(
      "Supabase order load error:",
      error
    );


    return [];

  }


  if(
    !data ||
    !data.length
  ){

    return [];

  }


  return data

    .map(
      row => {

        const d =
          row.order_data ||
          {};


        const team =
          teams.find(
            t =>
              String(t.id) ===
              String(d.memberId)
          );


        return {

          pick:
            Number(d.pick),

          team:

            team

              ? {
                  ...team
                }

              : {

                  id:
                    String(
                      d.memberId
                    ),

                  name:
                    d.member ||
                    "Unknown",

                  weight:
                    0,

                  image:
                    ""

                }

        };

      }
    )

    .filter(
      x =>
        x.pick
    )

    .sort(
      (a,b) =>
        b.pick -
        a.pick
    );

}


/* =========================================================
   SUPABASE — RESET SAVED DRAFT
   ========================================================= */

async function clearDraftOrderFromSupabase(){

  const {
    error
  } =
    await supabase

      .from(
        SUPABASE_ORDERS_TABLE_NAME
      )

      .delete()

      .not(
        "id",
        "is",
        null
      );


  if(error){

    console.error(
      "Supabase reset error:",
      error
    );


    showStatus(
      "Error resetting saved draft."
    );


    return false;

  }


  savedDraftOrder =
    [];


  return true;

}


/* =========================================================
   COMMISSIONER LOCK
   ========================================================= */

function openCommissioner(){

  commissionerLoginBox
    .classList
    .remove(
      "hidden"
    );


  commissionerPassword.focus();

}


function closeCommissioner(){

  commissionerLoginBox
    .classList
    .add(
      "hidden"
    );


  commissionerPassword.value =
    "";

}


function lockCommissioner(){

  commissionerUnlocked =
    false;


  commissionerPanel
    .classList
    .add(
      "hidden"
    );


  closeCommissioner();


  /*
     renderInputs() also hides the
     team settings panel.
  */

  renderInputs();


  showStatus(
    "Commissioner tools locked."
  );

}


function unlockCommissioner(){

  if(
    commissionerPassword.value !==
    COMMISSIONER_PASSWORD
  ){

    showStatus(
      "Incorrect commissioner password."
    );


    commissionerPassword.select();


    return;

  }


  commissionerUnlocked =
    true;


  commissionerLoginBox
    .classList
    .add(
      "hidden"
    );


  commissionerPanel
    .classList
    .remove(
      "hidden"
    );


  commissionerPassword.value =
    "";


  /*
     renderInputs() reveals the
     team settings panel.
  */

  renderInputs();


  showStatus(
    "Commissioner tools unlocked."
  );

}


/* =========================================================
   SAVE CONFIGURATION
   ========================================================= */

async function saveConfiguration(){

  if(!commissionerUnlocked)
    return;


  const valid =
    teams.every(
      team =>
        team.name.trim() &&
        Number(team.weight) > 0
    );


  if(!valid){

    showStatus(
      "Every team needs a name and positive odds."
    );


    return;

  }


  const success =
    await saveTeamsToSupabase();


  if(success){

    showStatus(
      "Configuration saved to Supabase."
    );


    renderInputs();

    renderPermanentLabels();

  }

}


/* =========================================================
   CREATE RUNNER
   ========================================================= */

function addRunner(
  team,
  index
){

  const el =
    document.createElement(
      "div"
    );


  el.className =
    "runner";


  el.style.top =
    (
      12 +
      index *
      (
        76 /
        Math.max(
          1,
          teams.length - 1
        )
      )
    ) +
    "%";


  el.style.left =
    "8%";


  const imageHTML =
    team.image

      ? `

        <img
          class="player-image"
          src="${escapeHTML(team.image)}"
          alt="${escapeHTML(team.name)}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >

        <div
          class="player-image"
          style="display:none;align-items:center;justify-content:center;font-weight:900;color:#fff;"
        >
          ${escapeHTML(
            team.name
              .charAt(0)
              .toUpperCase()
          )}
        </div>

      `

      : `

        <div
          class="player-image"
          style="display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;"
        >
          ${escapeHTML(
            team.name
              .charAt(0)
              .toUpperCase()
          )}
        </div>

      `;


  el.innerHTML = `

    ${imageHTML}

    <div class="tag">

      ${escapeHTML(
        team.name
      )}

      •

      ${team.weight}%

    </div>

  `;


  field.appendChild(
    el
  );


  return el;

}


/* =========================================================
   RESET VISUALS
   ========================================================= */

function resetVisuals(){

  cancelAnimationFrame(
    raf
  );


  raceRunning =
    false;


  runners =
    [];


  field

    .querySelectorAll(
      ".runner"
    )

    .forEach(
      el =>
        el.remove()
    );


  draftOrderList.innerHTML =
    "";


  showStatus(
    "Ready at the starting line."
  );

}


/* =========================================================
   DISPLAY RESULTS
   ========================================================= */

function renderResults(
  order,
  sortByPick = true
){

  draftOrderList.innerHTML =
    "";


  const items =
    sortByPick

      ? [...order].sort(
          (a,b) =>
            a.pick -
            b.pick
        )

      : [...order];


  items.forEach(
    item => {

      const li =
        document.createElement(
          "li"
        );


      li.innerHTML = `

        <span>

          <strong>
            #${item.pick}
          </strong>

          ${escapeHTML(
            item.team.name
          )}

        </span>


        <span>

          ${item.team.weight}% odds

        </span>

      `;


      draftOrderList.appendChild(
        li
      );

    }
  );

}


/* =========================================================
   REVEAL ONE DRAFT RESULT
   ========================================================= */

function revealDraftResult(
  item
){

  const li =
    document.createElement(
      "li"
    );


  li.innerHTML = `

    <span>

      <strong>
        #${item.pick}
      </strong>

      ${escapeHTML(
        item.team.name
      )}

    </span>


    <span>

      ${item.team.weight}% odds

    </span>

  `;


  draftOrderList.appendChild(
    li
  );

}


/* =========================================================
   RUN THE DASH
   ========================================================= */

async function start(){

  if(raceRunning)
    return;


  resetVisuals();


  /*
     IMPORTANT:

     Supabase is the single source of truth.

     If a draft already exists, NEVER generate
     another random order.

     Everyone gets the same saved result until
     the Commissioner resets the saved draft.
  */

  if(
    !savedDraftOrder ||
    savedDraftOrder.length !==
    teams.length
  ){

    showStatus(
      "Creating the draft order..."
    );


    const newOrder =
      createReverseDraftOrder();


    if(
      newOrder.length !==
      teams.length
    ){

      showStatus(
        "Could not create a complete draft order."
      );


      return;

    }


    const saved =
      await saveDraftOrderToSupabase(
        newOrder
      );


    if(!saved){

      showStatus(
        "Draft generated, but Supabase could not save it."
      );


      return;

    }


    savedDraftOrder =
      newOrder.map(
        x => ({

          pick:
            x.pick,

          team:{
            ...x.team
          }

        })
      );

  }


  /*
     Make a clean copy of the official
     saved result for the race.
  */

  const order =
    savedDraftOrder.map(
      x => ({

        pick:
          x.pick,

        team:{
          ...x.team
        }

      })
    );


  raceRunning =
    true;


  showStatus(
    "The draft is locked in — the race is on!"
  );


  /*
     Create all runners.

     They stay visible after crossing the
     finish line.
  */

  runners =
    teams.map(
      (
        team,
        index
      ) => ({

        team:{
          ...team
        },

        el:
          addRunner(
            team,
            index
          ),

        finish:
          0,

        revealed:
          false,

        rank:
          -1

      })
    );


  /*
     The saved order is already in reveal order:

     #8
     #7
     #6
     #5
     #4
     #3
     #2
     #1

     Give them deliberately tight finish times.
  */

  const baseFinish =
    14500;

  const finishGap =
    450;


  order.forEach(
    (
      item,
      rank
    ) => {

      const runner =
        runners.find(
          r =>
            String(r.team.id) ===
            String(item.team.id)
        );


      if(!runner)
        return;


      runner.pick =
        item.pick;


      runner.rank =
        rank;


      /*
         No random jitter here.

         The visual race is deterministic,
         so everyone sees the same race behavior.
      */

      runner.finish =
        baseFinish +
        rank *
        finishGap;

    }
  );


  const startTime =
    performance.now();


  const raceDuration =
    baseFinish +
    (
      order.length - 1
    ) *
    finishGap;


  function revealRunner(
    r
  ){

    if(r.revealed)
      return;


    r.revealed =
      true;


    r.el.classList.add(
      "finished"
    );


    r.el.style.left =
      "84%";


    const tag =
      r.el.querySelector(
        ".tag"
      );


    if(tag){

      tag.innerHTML =
        `${escapeHTML(r.team.name)} • ${r.team.weight}%`;

    }


    const result =
      order.find(
        item =>
          String(item.team.id) ===
          String(r.team.id)
      );


    if(result){

      /*
         Reveal the draft result immediately
         when this runner crosses.
      */

      revealDraftResult(
        result
      );

    }

  }


  function frame(
    now
  ){

    const elapsed =
      now -
      startTime;


    const overallProgress =
      Math.min(
        1,
        elapsed /
        raceDuration
      );


    runners.forEach(
      r => {

        const finishTime =
          r.finish;


        const individualProgress =
          Math.min(
            1,
            elapsed /
            finishTime
          );


        const sharedProgress =
          overallProgress;


        /*
           Everyone shares almost the exact
           same race progress.

           This keeps the pack together.
        */

        const progress =
          Math.min(

            1,

            (
              sharedProgress *
              0.88
            ) +

            (
              individualProgress *
              0.12
            )

          );


        /*
           Small deterministic surges and fades.

           These make the race look alive
           without allowing anyone to pull
           far away.
        */

        const phase =
          r.rank *
          0.72;


        const surge =
          Math.sin(

            progress *
            Math.PI *
            5 +

            phase

          ) *
          0.010;


        const fade =
          Math.sin(

            progress *
            Math.PI *
            2.2 +

            phase *
            1.7

          ) *
          0.006;


        const startPosition =
          8;


        const finishPosition =
          84;


        const basePosition =
          startPosition +

          progress *
          (
            finishPosition -
            startPosition
          );


        const currentPosition =
          Math.min(

            finishPosition,

            Math.max(

              startPosition,

              basePosition +

              (
                surge +
                fade
              ) *
              100

            )

          );


        r.el.style.left =
          currentPosition +
          "%";


        if(
          elapsed >=
          finishTime
        ){

          revealRunner(
            r
          );

        }

      }
    );


    if(
      runners.every(
        r =>
          r.revealed
      )
    ){

      raceRunning =
        false;


      /*
         Once the race is completely over,
         display the final draft order from
         Pick #1 through Pick #8.
      */

      renderResults(
        savedDraftOrder,
        true
      );


      showStatus(
        "DRAFT ORDER COMPLETE — Pick #1 is the final team remaining."
      );


      return;

    }


    raf =
      requestAnimationFrame(
        frame
      );

  }


  raf =
    requestAnimationFrame(
      frame
    );

}


/* =========================================================
   LOAD SAVED RESULT WITHOUT RUNNING THE RACE
   ========================================================= */

function showSavedDraft(){

  if(
    !savedDraftOrder ||
    !savedDraftOrder.length
  ){

    return;

  }


  resetVisuals();


  /*
     A completed saved draft is shown when
     the page loads.

     Clicking START will replay the exact
     same saved order rather than drawing again.
  */

  runners =
    teams.map(
      (
        team,
        index
      ) => {

        const el =
          addRunner(
            team,
            index
          );


        el.style.left =
          "84%";


        el.classList.add(
          "finished"
        );


        return {

          team:{
            ...team
          },

          el,

          finish:
            0,

          revealed:
            true

        };

      }
    );


  renderResults(
    savedDraftOrder,
    true
  );


  showStatus(
    "Saved draft loaded from Supabase."
  );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize(){

  showStatus(
    "Loading draft configuration..."
  );


  teams =
    await loadTeamsFromSupabase();


  /*
     The team settings panel remains hidden
     because Commissioner is locked.
  */

  renderInputs();

  renderPermanentLabels();


  savedDraftOrder =
    await loadDraftOrderFromSupabase();


  if(
    savedDraftOrder.length
  ){

    showSavedDraft();

  }

  else{

    showStatus(
      "Ready at the starting line."
    );

  }

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById(
    "start"
  )
  .addEventListener(
    "click",
    start
  );


document
  .getElementById(
    "reset"
  )
  .addEventListener(
    "click",
    () => {

      /*
         IMPORTANT:

         Normal RESET only resets the visual race.
         It does NOT delete the official Supabase draft.

         Therefore pressing START again will replay
         the exact same draft order.
      */

      resetVisuals();


      showStatus(
        "Ready at the starting line."
      );


      renderPermanentLabels();

    }
  );


commissionerBtn
  .addEventListener(
    "click",
    openCommissioner
  );


unlockCommissionerBtn
  .addEventListener(
    "click",
    unlockCommissioner
  );


commissionerPassword
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key === "Enter"
      ){

        unlockCommissioner();

      }

    }
  );


cancelCommissionerBtn
  .addEventListener(
    "click",
    closeCommissioner
  );


lockCommissionerBtn
  .addEventListener(
    "click",
    lockCommissioner
  );


saveConfigBtn
  .addEventListener(
    "click",
    saveConfiguration
  );


/* =========================================================
   COMMISSIONER — RESET SAVED DRAFT
   ========================================================= */

resetDraftBtn
  .addEventListener(
    "click",
    async () => {

      const confirmed =
        window.confirm(
          "Reset the saved draft order in Supabase?"
        );


      if(!confirmed)
        return;


      const success =
        await clearDraftOrderFromSupabase();


      if(success){

        resetVisuals();


        showStatus(
          "Saved draft cleared. Ready for a new reverse-odds draw."
        );

      }

    }
  );


/* =========================================================
   START
   ========================================================= */

initialize();

</script>
